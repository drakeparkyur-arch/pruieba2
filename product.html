<h1>Nuestra carta</h1>

<div class="filtros">
    @for (c of categorias; track c) {
        <button [class.activo]="c === categoriaActual()" (click)="elegir(c)">{{ c }}</button>
    }
</div>

<div class="tarjetas">
    @for (p of productosFiltrados(); track p.id) {
        <article class="tarjeta">
            <span class="etiqueta">{{ p.categoria }}</span>
            <h3>{{ p.nombre }}</h3>
            <p>{{ p.descripcion }}</p>
            <p class="precio">S/ {{ p.precio | number:'1.2-2' }}</p>
        </article>
    } @empty {
        <p>No hay productos en esta categoría.</p>
    }
</div>
